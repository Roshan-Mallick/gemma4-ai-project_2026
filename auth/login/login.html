<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - SafeHire AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-container">

            <!-- LEFT: Auth Form -->
            <div class="auth-form-panel">
            </div>

            <!-- RIGHT: Branding Panel -->
            <div class="auth-brand-panel">
                <div class="brand-content">

                    <!-- Illustration -->
                    <div class="brand-illustration">
                        <!-- Background rings -->
                        <div class="ring ring-1"></div>
                        <div class="ring ring-2"></div>

                        <!-- Central shield -->
                        <div class="shield-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                <path d="M9 12l2 2 4-4"/>
                            </svg>
                        </div>

                        <!-- Floating card: Verified -->
                        <div class="float-card card-verified">
                            <div class="card-dot dot-green"></div>
                            <span>Verified ✓</span>
                        </div>

                        <!-- Floating card: Scam Detected -->
                        <div class="float-card card-scam">
                            <div class="card-dot dot-red"></div>
                            <span>Scam Detected</span>
                        </div>

                        <!-- Floating card: Domain Extraction -->
                        <div class="float-card card-domain">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            <span>Domain Extraction</span>
                        </div>

                        <!-- Floating card: Recruiter Info -->
                        <div class="float-card card-recruiter">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <span>Recruiter Info</span>
                        </div>

                        <!-- Floating card: Company Location -->
                        <div class="float-card card-location">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            <span>Company Location</span>
                        </div>

                        <!-- Floating card: Analytics -->
                        <div class="float-card card-analytics">
                            <div class="mini-bars">
                                <div class="bar bar-1"></div>
                                <div class="bar bar-2"></div>
                                <div class="bar bar-3"></div>
                                <div class="bar bar-4"></div>
                            </div>
                            <span>High Accuracy</span>
                        </div>
                    </div>

                    <!-- Text -->
                    <h2 class="brand-heading">Protect yourself from fake job posts.</h2>
                    <p class="brand-description">SafeHire AI analyzes job listings in real-time and gives you an explainable verdict — so you can focus on the right opportunities.</p>

                    <!-- Dots -->
                    <div class="brand-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <script src="login.js" defer></script>
</body>
</html>
